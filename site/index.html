<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Benchmark 9 Mesin Analisis Crypto</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#5f6773;--card:#f4f5f7;--bd:#d9dce1;--ok:#0a7d3b;--bad:#b3261e;--warn:#9a6700;--acc:#2457d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--fg:#e6e8eb;--mut:#98a0ab;--card:#1a2027;--bd:#2c343d;--ok:#4cc38a;--bad:#ff7b72;--warn:#e3b341;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 14px;border-bottom:1px solid var(--bd)}h1{font-size:18px;margin:0}h3{margin:16px 0 6px}small,.mut{color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:2}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:8px;white-space:nowrap;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px 14px;max-width:1400px;margin:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:14px}.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--bd)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;white-space:nowrap}th{background:var(--card);cursor:pointer;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{padding:1px 7px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.TP,.good{color:var(--ok)}.SL,.badc{color:var(--bad)}.AMBIGUOUS,.INVALID,.EXPIRED,.warnc{color:var(--warn)}
.banner{padding:10px;border-radius:8px;margin:8px 0;border:1px solid var(--bd);background:var(--card)}.banner.bad{border-color:var(--bad)}.banner.warn{border-color:var(--warn)}
select,input{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}svg text{fill:var(--mut);font-size:11px}
.cell{text-align:center;min-width:64px}
</style></head><body>
<header><h1>Benchmark 9 Mesin Analisis Crypto</h1><small id="gen">Memuat…</small></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%',n2=v=>v==null?'—':(+v).toFixed(2),px=v=>v==null?'—':(+v).toPrecision(6).replace(/\.?0+$/,'');
const TABS=['Ringkasan','Perbandingan','Setup','Konsensus','Per Koin','Kesehatan Mesin','Kualitas Data','Metodologi'];
const COL=['#2457d6','#e0662b','#1f9d6b','#a34fd1','#c9a100','#d6336c','#0b9fb5','#7a5c3e','#6b7280'];
const SCOPES={common:'Setara: sejak semua mesin aktif',independent:'Independen (1 per klaster near-duplicate)',all:'Semua setup'};
let D,scope='independent',sortK='analysisUtc',sortDir=-1,F={engine:'',result:'',dir:'',q:''},tab=decodeURIComponent(location.hash.slice(1))||TABS[0];
const L=id=>D.engineInfo[id]?.label||id,C=id=>COL[D.engineIds.indexOf(id)%COL.length];
const chip=id=>`<span class="dot" style="background:${C(id)}"></span>${esc(L(id))}`;
const scopeSel=()=>`<div class="bar"><label>Sampel: <select onchange="scope=this.value;render()">${Object.entries(SCOPES).map(([k,v])=>`<option value="${k}" ${scope==k?'selected':''}>${v}</option>`).join('')}</select></label>${scope=='common'?`<small class="mut">mulai ${esc(D.commonFromUtc?.slice(0,16).replace('T',' '))} UTC</small>`:''}</div>`;
const HS={OK:['good','OK'],OK_NO_SETUPS:['good','OK (0 setup)'],FAILED:['badc','GAGAL'],NEEDS_SELECTOR_VERIFICATION:['warnc','Selector belum diverifikasi'],ZERO_CARDS_UNCONFIRMED:['warnc','0 kartu (tak terkonfirmasi)'],NO_RUN:['mut','Belum dijalankan']};
const hs=h=>{const[c,t]=HS[h.status]||['mut',h.status];return `<span class="${c}">${t}</span>`};
const board=()=>D.engineIds.map(id=>({id,s:D.engines[scope][id].summary})).sort((a,b)=>((b.s.resolved>=D.comparison[scope].minSample)-(a.s.resolved>=D.comparison[scope].minSample))||((b.s.expectancyR??-9)-(a.s.expectancyR??-9)));
function curveSvg(){const W=900,H=260,P=36;let all=[];D.engineIds.forEach(id=>D.engines[scope][id].curve.forEach(p=>all.push([Date.parse(p[0]),p[1]])));
 if(!all.length)return '<p class="mut">Belum ada hasil TP/SL untuk digambar.</p>';
 const x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]))||x0+1,ys=all.map(p=>p[1]).concat(0),y0=Math.min(...ys),y1=Math.max(...ys)||1;
 const X=t=>P+(t-x0)/((x1-x0)||1)*(W-P-8),Y=v=>H-20-(v-y0)/((y1-y0)||1)*(H-34);
 const lines=D.engineIds.map(id=>{const c=D.engines[scope][id].curve;return c.length?`<polyline fill="none" stroke="${C(id)}" stroke-width="1.8" points="${c.map(p=>X(Date.parse(p[0]))+','+Y(p[1])).join(' ')}"><title>${esc(L(id))}</title></polyline>`:''}).join('');
 return `<div class="wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px"><line x1="${P}" x2="${W-8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/><text x="2" y="${Y(y1)+4}">${n2(y1)}R</text><text x="2" y="${Y(y0)}">${n2(y0)}R</text><text x="${P}" y="${H-4}">${new Date(x0).toISOString().slice(0,10)}</text><text x="${W-70}" y="${H-4}">${new Date(x1).toISOString().slice(0,10)}</text>${lines}</svg></div><div class="bar">${D.engineIds.map(id=>`<small>${chip(id)}</small>`).join(' ')}</div>`}
function statCard(id){const s=D.engines[scope][id].summary,h=D.engineInfo[id].health,small=s.resolved<D.comparison[scope].minSample;
 return `<div class="card"><h3>${chip(id)}</h3><small class="mut">${esc(D.engineInfo[id].family||'')} · ${hs(h)}</small>
 <div class="kv"><span>Terbit / terpicu</span><b>${s.published} / ${s.triggered}</b></div><div class="kv"><span>TP / SL</span><b>${s.counts.TP} / ${s.counts.SL}</b></div>
 <div class="kv"><span>Pending / Expired / Invalid</span><b>${s.counts.PENDING} / ${s.counts.EXPIRED} / ${s.counts.INVALID}</b></div>
 <div class="kv"><span>Win rate (n=${s.resolved})</span><b>${pct(s.winRate)}${s.winRateCI95?` <small>[${pct(s.winRateCI95[0])}–${pct(s.winRateCI95[1])}]</small>`:''}</b></div>
 <div class="kv"><span>Expectancy R</span><b class="${s.expectancyR>0?'good':s.expectancyR<0?'badc':''}">${n2(s.expectancyR)}</b></div><div class="kv"><span>Total R / Max DD</span><b>${n2(s.totalR)} / ${n2(s.maxDrawdownR)}</b></div>
 ${small?`<small class="warnc">Sampel kecil (min ${D.comparison[scope].minSample}); belum bisa disimpulkan.</small>`:''}</div>`}
function alerts(){const out=[];D.engineIds.forEach(id=>{const h=D.engineInfo[id].health;
 if(h.status==='FAILED')out.push(`<div class="banner bad"><b>${esc(L(id))}</b>: gagal mengambil data (${esc(h.errors.join('; ')||'tanpa detail')}). Ini BUKAN berarti tidak ada setup.</div>`);
 else if(h.status==='NEEDS_SELECTOR_VERIFICATION')out.push(`<div class="banner warn"><b>${esc(L(id))}</b>: pembaca halaman belum diverifikasi, belum ada data. Jalankan workflow Discover (lihat docs/VERIFIED.md).</div>`);
 else if(h.status==='NO_RUN')out.push(`<div class="banner warn"><b>${esc(L(id))}</b>: belum pernah dikoleksi.</div>`)});return out.join('')}
const V={
Ringkasan(){const b=board(),c=D.comparison[scope];return `${alerts()}${scopeSel()}<div class="banner"><b>Hasil teoretis berbasis candle Binance</b>, bukan trading nyata. Peringkat hanya bermakna bila n ≥ ${c.minSample}; selisih antar-mesin diuji di tab Perbandingan.</div>
<h3>Peringkat (expectancy per setup, satuan R)</h3><div class="wrap"><table><tr><th>#</th><th>Mesin</th><th class="n">Terbit</th><th class="n">n TP/SL</th><th class="n">Win rate</th><th class="n">Expectancy R</th><th class="n">Total R</th><th class="n">Max DD</th><th>Status</th></tr>
${b.map((x,i)=>`<tr><td>${x.s.resolved>=c.minSample?i+1:'—'}</td><td>${chip(x.id)}</td><td class="n">${x.s.published}</td><td class="n">${x.s.resolved}</td><td class="n">${pct(x.s.winRate)}</td><td class="n">${n2(x.s.expectancyR)}</td><td class="n">${n2(x.s.totalR)}</td><td class="n">${n2(x.s.maxDrawdownR)}</td><td>${hs(D.engineInfo[x.id].health)}</td></tr>`).join('')}</table></div>
<h3>Kurva R kumulatif</h3>${curveSvg()}<h3>Kartu mesin</h3><div class="grid">${b.map(x=>statCard(x.id)).join('')}</div>`},
Perbandingan(){const c=D.comparison[scope],el=c.eligible,cell=(a,b)=>{if(a===b)return '<td class="cell mut">·</td>';const k=c.cells.find(x=>(x.a==a&&x.b==b)||(x.a==b&&x.b==a));if(!k)return '<td class="cell mut" title="sampel belum cukup">n/a</td>';const d=k.a==a?k.diff:-k.diff,w=k.winner;return `<td class="cell ${w==a?'good':w==b?'badc':''}" title="CI terkoreksi [${n2(k.ci[0])}, ${n2(k.ci[1])}]">${d>0?'+':''}${n2(d)}${w?' ★':''}</td>`};
 return `${scopeSel()}<div class="banner ${el.length<2?'warn':''}">${el.length<2?`<b>Belum ada kesimpulan.</b> Hanya ${el.length} mesin dengan n ≥ ${c.minSample}.`:`${el.length} mesin memenuhi n ≥ ${c.minSample} → ${c.nPairs} pasangan diuji, α terkoreksi = ${c.alpha.toExponential(1)}.`} ★ = selisih signifikan.<br><small>${esc(c.caveat)}</small></div>
<h3>Matriks selisih expectancy (baris − kolom, R)</h3><div class="wrap"><table><tr><th></th>${D.engineIds.map(id=>`<th class="cell">${esc(L(id))}<br><small>n=${c.n[id]}</small></th>`).join('')}</tr>${D.engineIds.map(a=>`<tr><td>${chip(a)}</td>${D.engineIds.map(b=>cell(a,b)).join('')}</tr>`).join('')}</table></div>
<h3>Per arah dan alasan entry</h3><div class="grid">${['byDirection','byReason'].map(k=>`<div class="card"><h3>${k=='byDirection'?'Arah':'Alasan entry'}</h3><div class="wrap"><table><tr><th>Mesin</th><th>Grup</th><th class="n">n</th><th class="n">Win</th><th class="n">Exp R</th></tr>${D.engineIds.flatMap(id=>Object.entries(D.engines[scope][id][k]).filter(([,s])=>s.resolved).map(([g,s])=>`<tr><td>${chip(id)}</td><td>${esc(g)}</td><td class="n">${s.resolved}</td><td class="n">${pct(s.winRate)}</td><td class="n">${n2(s.expectancyR)}</td></tr>`)).join('')||'<tr><td colspan=5 class="mut">—</td></tr>'}</table></div></div>`).join('')}</div>
<h3>Mingguan (tanggal hasil, WIB)</h3><div class="wrap"><table><tr><th>Mesin</th><th>Minggu</th><th class="n">TP</th><th class="n">SL</th><th class="n">Total R</th></tr>${D.engineIds.flatMap(id=>D.engines[scope][id].weekly.slice(-6).map(x=>`<tr><td>${chip(id)}</td><td>${x.period}</td><td class="n">${x.tp}</td><td class="n">${x.sl}</td><td class="n">${n2(x.totalR)}</td></tr>`)).join('')||'<tr><td colspan=5 class="mut">—</td></tr>'}</table></div>`},
Setup(){const q=F.q.toLowerCase();let r=D.setups.filter(x=>(!F.engine||x.engine==F.engine)&&(!F.result||x.result==F.result)&&(!F.dir||x.direction==F.dir)&&(!q||(x.ticker||'').toLowerCase().includes(q)));
 r=r.sort((a,b)=>((a[sortK]??'')>(b[sortK]??'')?1:-1)*sortDir);const tot=r.length;r=r.slice(0,300);
 const cols=[['engine','Mesin'],['analysisWib','Analisis (WIB)'],['ticker','Koin'],['direction','Arah'],['entry','Entry'],['tp','TP'],['sl','SL'],['rr','R:R'],['reason','Alasan'],['result','Hasil'],['resultWib','Hasil (WIB)'],['r','R']];
 return `<div class="bar"><select onchange="F.engine=this.value;render()"><option value="">Semua mesin</option>${D.engineIds.map(id=>`<option value="${id}" ${F.engine==id?'selected':''}>${esc(L(id))}</option>`).join('')}</select><select onchange="F.result=this.value;render()"><option value="">Semua hasil</option>${['PENDING','TP','SL','CANCELLED','EXPIRED','INVALID','AMBIGUOUS'].map(s=>`<option ${F.result==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="F.dir=this.value;render()"><option value="">Arah</option><option ${F.dir=='LONG'?'selected':''}>LONG</option><option ${F.dir=='SHORT'?'selected':''}>SHORT</option></select><input placeholder="Cari koin" value="${esc(F.q)}" onchange="F.q=this.value;render()"><small class="mut">${tot} setup${tot>300?' (300 teratas)':''}</small></div>
<div class="wrap"><table><thead><tr>${cols.map(([k,l])=>`<th onclick="sortBy('${k}')">${l}${sortK==k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr><td>${chip(x.engine)}</td><td>${esc(x.analysisWib)}${x.analysisTimeSource=='first_seen'?' <small class="mut" title="waktu scan pertama">~</small>':''}</td><td>${esc(x.ticker)}</td><td>${esc(x.direction)}</td><td>${x.entryRange?px(x.entryRange[0])+'–'+px(x.entryRange[1]):px(x.entry)}</td><td>${(x.tp||[]).map(px).join(', ')||'—'}</td><td>${px(x.sl)}</td><td>${n2(x.rr)}</td><td title="${esc(x.reason)}">${esc((x.reason||'').slice(0,50))}</td><td><span class="tag ${x.result}">${x.result}</span>${x.isPrimary?'':' <small class="mut">≈dup</small>'}</td><td>${esc(x.resultWib)}</td><td class="n">${n2(x.r)}</td></tr>`).join('')||'<tr><td colspan=12 class="mut">Tidak ada data.</td></tr>'}</tbody></table></div>`},
Konsensus(){return `<p class="mut">Simbol yang dianalisis ≥2 mesin dalam 48 jam terakhir (setup terbaru per mesin). Konflik = ada yang LONG dan SHORT.</p><div class="wrap"><table><tr><th>Koin</th><th class="n">Mesin</th><th class="n">LONG</th><th class="n">SHORT</th><th>Status</th><th>Rincian</th></tr>${D.consensus.map(c=>`<tr><td>${esc(c.symbol)}</td><td class="n">${c.engines}</td><td class="n">${c.long}</td><td class="n">${c.short}</td><td class="${c.conflict?'badc':'good'}">${c.conflict?'KONFLIK':'Searah'}</td><td><small>${c.detail.map(d=>`${esc(L(d.engine))} ${d.direction} ${px(d.entry)} → ${d.result}`).join(' · ')}</small></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Belum ada koin yang tumpang tindih.</td></tr>'}</table></div>`},
'Per Koin'(){const ks=[...new Set(D.engineIds.flatMap(m=>Object.keys(D.engines[scope][m].byTicker)))].sort();return `${scopeSel()}<div class="wrap"><table><tr><th>Koin</th>${D.engineIds.map(id=>`<th>${esc(L(id))}<br><small>n · win · expR</small></th>`).join('')}</tr>${ks.map(k=>`<tr><td>${esc(k)}</td>${D.engineIds.map(m=>{const s=D.engines[scope][m].byTicker[k];return `<td><small>${s&&s.resolved?`${s.resolved} · ${pct(s.winRate)} · ${n2(s.expectancyR)}`:s?`${s.published} terbit`:'—'}</small></td>`}).join('')}</tr>`).join('')}</table></div>`},
'Kesehatan Mesin'(){const w=s=>s?new Date(Date.parse(s)+7*36e5).toISOString().slice(0,16).replace('T',' '):'—';return `<div class="wrap"><table><tr><th>Mesin</th><th>Tipe</th><th>Status terakhir</th><th class="n">Uptime koleksi</th><th class="n">Gagal beruntun</th><th>Terakhir OK (WIB)</th><th>Setup terbaru (WIB)</th><th>Pelacakan mulai</th><th>Catatan</th></tr>${D.engineIds.map(id=>{const e=D.engineInfo[id],h=e.health;return `<tr><td>${chip(id)}<br><a href="${esc(e.url)}" target="_blank" rel="noopener"><small>${esc(e.url)}</small></a></td><td>${esc(e.type)}</td><td>${hs(h)}</td><td class="n">${pct(h.uptime)} (${h.runs})</td><td class="n ${h.failureStreak>2?'badc':''}">${h.failureStreak}</td><td>${w(h.lastOkUtc)}</td><td>${w(h.newestSetupUtc)}</td><td>${w(e.trackingStartedUtc)}</td><td style="white-space:normal"><small>${esc([...h.errors,...h.warnings].join('; ')).slice(0,240)}</small></td></tr>`}).join('')}</table></div><p class="mut">Run terakhir: ${esc(JSON.stringify(D.diagnostics.lastRun?.evaluation))}</p>`},
'Kualitas Data'(){const q=D.quality,sec=(t,a)=>`<h3>${t} (${a.length})</h3>`+(a.length?`<div class="wrap"><table><tr><th>Mesin</th><th>Waktu</th><th>Koin</th><th>Arah</th><th>Hasil</th><th>Catatan</th></tr>${a.slice(0,60).map(r=>`<tr><td>${chip(r.engine)}</td><td>${esc(r.analysisWib)}</td><td>${esc(r.ticker)}</td><td>${esc(r.direction)}</td><td>${r.result}${r.sourceResult?` <small class="mut">(sumber: ${esc(r.sourceResult)})</small>`:''}</td><td style="white-space:normal"><small>${esc([...r.warnings,...r.notes].join(' ')).slice(0,200)}</small></td></tr>`).join('')}</table></div>`:'<p class="mut">Tidak ada.</p>');
 return `<div class="banner">Selisih hasil sumber vs evaluasi kami ditampilkan agar klaim tiap mesin dapat diaudit.</div>${sec('Beda hasil sumber vs evaluasi',q.sourceDisagreements)}${sec('Invalid',q.invalid)}${sec('Ambiguous',q.ambiguous)}${sec('Data harga belum terverifikasi',q.unverified)}${sec('Peringatan parsing',q.withWarnings)}${sec('Near-duplicate',q.nearDuplicates)}`},
Metodologi(){return `<div class="card"><h3>Aturan yang sama untuk semua mesin</h3><ul><li>Setiap setup dievaluasi ulang dari candle Binance Spot (1m untuk menyelesaikan TP dan SL dalam candle yang sama). Klaim hasil dari mesin hanya disimpan sebagai pembanding.</li><li>Fill limit saat harga menyentuh level; tanpa fee, funding, dan slippage. R = +RR untuk TP dan −1 untuk SL; hanya TP pertama.</li><li>TP sebelum entry tersentuh = EXPIRED. TTL entry 72 jam, batas hold 30 hari.</li><li>Waktu analisis: dari sumber (mesin jurnal) atau waktu scan pertama (<i>first_seen</i>, ditandai ~). Setup yang sudah ada sebelum pelacakan dimulai tidak dievaluasi.</li><li><b>Sampel independen</b>: satu setup per klaster near-duplicate. <b>Sampel setara</b>: hanya setup sejak semua mesin berdata aktif.</li><li>Perbandingan memakai bootstrap selisih expectancy dengan koreksi Bonferroni untuk banyak pasangan; peringkat hanya diberi nomor bila n ≥ ${D.comparison.independent.minSample}.</li><li>Mesin tipe browser yang selector-nya belum terverifikasi tidak ditebak; ditandai di Kesehatan Mesin.</li></ul></div>`}};
function sortBy(k){sortDir=sortK==k?-sortDir:1;sortK=k;render()}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';location.hash=encodeURIComponent(tab);render()">${t}</button>`).join('');$('#main').innerHTML=(V[tab]||V.Ringkasan)()}
fetch('data/dashboard.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{D=d;$('#gen').textContent=`Diperbarui ${d.generatedAtWib} WIB · ${d.counts.engines} mesin · ${d.counts.setups} setup · ${d.methodology.source}`;render()}).catch(e=>{$('#main').innerHTML=`<div class="banner bad">Gagal memuat data/dashboard.json: ${esc(e.message)}</div>`});
</script></body></html>
